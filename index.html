<!DOCTYPE html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Куб из 6 тетраэдров</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b101a;color:#eaf0fa;font:16px system-ui,sans-serif;min-height:100dvh}main{max-width:1050px;margin:auto;padding:22px 16px max(22px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:start;gap:10px}h1{font-size:clamp(24px,5vw,38px);margin:0;letter-spacing:-.04em}p{color:#a0b0c5;margin:6px 0 16px;line-height:1.4}.badge{border:1px solid #37445c;padding:7px 11px;border-radius:99px;font-size:13px;white-space:nowrap}.stage{position:relative;border:1px solid #26344a;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#202c40,#0c1422 72%)}canvas{width:100%;height:clamp(330px,55vh,600px);display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;left:15px;top:14px;color:#aebcd1;font-size:13px;pointer-events:none}.controls{padding:16px 0;display:grid;gap:15px}.row{display:flex;gap:8px;flex-wrap:wrap}button{background:#192437;border:1px solid #34435d;color:#eaf0fa;border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer}button.active{background:#4164b7;border-color:#6e91eb}label{display:flex;justify-content:space-between;align-items:center;font-weight:600}input[type=range]{width:100%;accent-color:#80a3ff;margin:6px 0}.slider{background:#151e2e;border:1px solid #26344a;border-radius:14px;padding:14px 16px}.legend{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.legend button{padding:9px 0;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px}.legend button.off{opacity:.35}.dot{width:11px;height:11px;border-radius:3px;display:inline-block}.small{font-size:13px;color:#96a5bb;margin:0}@media(max-width:400px){.legend{grid-template-columns:repeat(3,1fr)}.row button{font-size:14px;padding:10px}}
</style>
<main><header><div><h1>Куб из 6 тетраэдров</h1><p>Интерактивная пространственная модель</p></div><span class="badge">3D · 6 частей</span></header>
<section class="stage"><canvas id="view" aria-label="Вращаемая трехмерная модель"></canvas><div class="hint">Перетаскивайте для вращения · щипок для масштаба</div></section>
<div class="controls"><div class="slider"><label for="explode">Разборка куба <span id="percent">0%</span></label><input id="explode" type="range" min="0" max="100" value="0"><div class="small">Все шесть тетраэдров имеют одну общую пространственную диагональ.</div></div>
<div class="row"><button id="toggle">Разобрать</button><button id="auto">Автовращение</button><button id="faces">Грани</button><button id="reset">Сбросить вид</button><button id="minus">−</button><button id="plus">+</button></div>
<div class="legend" id="legend"></div><p class="small">Нажмите на цвет, чтобы скрыть или показать отдельный тетраэдр.</p></div></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const colors=['#ff5458','#34e15b','#f2e838','#ff9c28','#a36aea','#329bff'];
const perms=[[0,1,2],[2,1,0],[2,0,1],[1,2,0],[1,0,2],[0,2,1]];
const A=[-1,1,-1],B=[1,-1,1];
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/(Math.hypot(...a)||1)),avg=a=>mul(a.reduce(add,[0,0,0]),1/a.length);
const tets=perms.map((perm,i)=>{let p=A.slice(),v=[p.slice()];for(const k of perm){p=p.slice();p[k]=B[k];v.push(p)}return{v,c:avg(v),color:colors[i],visible:true}});
let yaw=-.46,pitch=.42,zoom=1,explosion=0,target=0,auto=false,solid=false,W=0,H=0;
const faces=[[0,1,2],[0,1,3],[0,2,3],[1,2,3]];
const slider=document.getElementById('explode'),percent=document.getElementById('percent');
function setTarget(t){target=t;slider.value=Math.round(t*100);percent.textContent=Math.round(t*100)+'%';document.getElementById('toggle').textContent=t>.5?'Собрать':'Разобрать'}
function rotate(p){let [x,y,z]=p;const a=Math.cos(yaw),b=Math.sin(yaw),c=Math.cos(pitch),d=Math.sin(pitch);let X=a*x+b*z,Z=-b*x+a*z;return[X,c*y-d*Z,d*y+c*Z]}
function project(p){const q=rotate(p),s=Math.min(W,H)*.34*zoom/(1+explosion*.32),f=6/(6-q[2]);return [W/2+q[0]*s*f,H/2-q[1]*s*f,q[2]]}
function shade(hex,k){let n=parseInt(hex.slice(1),16);return 'rgb('+[n>>16,(n>>8)&255,n&255].map(v=>Math.min(255,Math.round(v*k))).join(',')+')'}
function draw(){
  ctx.clearRect(0,0,W,H);
  const paths=[];
  for(const t of tets){if(!t.visible)continue;const displacement=mul(norm(t.c),explosion*1.42),v=t.v.map(p=>add(add(t.c,mul(sub(p,t.c),.979)),displacement));
    for(const f of faces){let outer=f.map(i=>v[i]),center=avg(outer),inner=outer.map(p=>add(center,mul(sub(p,center),.82)));let n=norm(cross(sub(outer[1],outer[0]),sub(outer[2],outer[0])));if(dot(n,sub(center,add(t.c,displacement)))<0)n=mul(n,-1);const nr=rotate(n),light=.69+.31*Math.max(0,dot(nr,norm([-.4,.75,1])));if(solid)paths.push({p:outer,fill:t.color,alpha:.38,light});
      for(let j=0;j<3;j++){let k=(j+1)%3;paths.push({p:[outer[j],outer[k],inner[k],inner[j]],fill:t.color,alpha:1,light})}
    }
  }
  for(const p of paths){p.s=p.p.map(project);p.z=p.s.reduce((s,v)=>s+v[2],0)/p.s.length}
  paths.sort((a,b)=>a.z-b.z);
  for(const p of paths){ctx.beginPath();p.s.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.globalAlpha=p.alpha;ctx.fillStyle=shade(p.fill,p.light);ctx.fill();ctx.globalAlpha=p.alpha*.8;ctx.strokeStyle='#f4f7ff';ctx.lineWidth=Math.max(.65,Math.min(1.3,W/470));ctx.lineJoin='round';ctx.stroke()}ctx.globalAlpha=1;
}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe(canvas);
let prev=performance.now();function frame(now){let dt=Math.min(50,now-prev);prev=now;if(auto)yaw+=dt*.00055;explosion+=(target-explosion)*Math.min(1,dt*.009);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
slider.oninput=()=>setTarget(Number(slider.value)/100);document.getElementById('toggle').onclick=()=>setTarget(target>.5?0:1);
document.getElementById('auto').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto)};
document.getElementById('faces').onclick=e=>{solid=!solid;e.currentTarget.classList.toggle('active',solid)};
document.getElementById('reset').onclick=()=>{yaw=-.46;pitch=.42;zoom=1;auto=false;document.getElementById('auto').classList.remove('active')};
const setZoom=z=>{zoom=Math.max(.5,Math.min(2.1,z))};document.getElementById('plus').onclick=()=>setZoom(zoom*1.16);document.getElementById('minus').onclick=()=>setZoom(zoom/1.16);
tets.forEach((t,i)=>{const b=document.createElement('button');b.innerHTML='<span class="dot" style="background:'+t.color+'"></span>'+(i+1);b.setAttribute('aria-label','Тетраэдр '+(i+1));b.setAttribute('aria-pressed','true');b.onclick=()=>{t.visible=!t.visible;b.classList.toggle('off',!t.visible);b.setAttribute('aria-pressed',t.visible)};document.getElementById('legend').append(b)});
const pointers=new Map();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);auto=false;document.getElementById('auto').classList.remove('active')};
canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),next=[e.clientX,e.clientY];if(pointers.size===1){yaw+=(next[0]-old[0])*.008;pitch+=(next[1]-old[1])*.008}else if(pointers.size===2){const other=[...pointers.entries()].find(([k])=>k!==e.pointerId)[1];const before=Math.hypot(...sub(old,other)),after=Math.hypot(...sub(next,other));if(before>5)setZoom(zoom*after/before)}pointers.set(e.pointerId,next)};
canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>pointers.delete(e.pointerId);canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.001))},{passive:false});
</script></html>
